stages:
  - build
  - test
  - security

build:
  stage: build
  image: node:18
  cache:
    paths:
      - node_modules/
  script:
    - npm install --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - build/

test:
  stage: test
  image: node:18
  cache:
    paths:
      - node_modules/
  script:
    - npm install --legacy-peer-deps
    - CI=true npm test -- --watchAll=false --passWithNoTests --forceExit

secret_detection:
  stage: security
  image: node:22
  script:
    - npm install -g secretlint @secretlint/secretlint-rule-preset-recommend
    - secretlint "**/*"
  allow_failure: true

dependency_scan:
  stage: security
  image: node:18
  cache:
    paths:
      - node_modules/
  script:
    - npm install --legacy-peer-deps
    - npm audit --json > audit-report.json || true
    - cat audit-report.json
  artifacts:
    paths:
      - audit-report.json
  allow_failure: true